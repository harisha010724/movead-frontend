name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_MUSHROOM_043C2F900 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist/web" # Built app content directory - optional
          # Without this Oryx runs `npm run build`, which emits the advertiser and
          # admin bundles instead of the single-origin one this app serves.
          app_build_command: "npm run build:web"
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
        # No VITE_* here. They come from `.env.production`, which is committed.
        #
        # This used to read VITE_GOOGLE_MAPS_API_KEY from a repository secret,
        # and that is what kept the map blank: an unset secret interpolates to
        # an empty string rather than to nothing, and Vite ranks a variable that
        # is already in the environment above any .env file. So the build
        # replaced a perfectly good key with "" every time, and the only symptom
        # was a panel asking for the key that had been set.
        #
        # A secret was the wrong instrument regardless. Vite inlines VITE_*
        # into the bundle, so this key is served to every visitor and cannot be
        # hidden by where it is stored. What protects it is the HTTP referrer
        # restriction on the key itself, in Google Cloud.

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
